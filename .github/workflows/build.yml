name: Build APK und IPA
on: [workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dateien einsortieren
        run: |
          mkdir -p www assets
          [ -f index.html ] && mv index.html www/ || true
          mv icon-*.png splash*.png assets/ 2>/dev/null || true
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spielhalle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dateien einsortieren
        run: |
          mkdir -p www assets
          [ -f index.html ] && mv index.html www/ || true
          mv icon-*.png splash*.png assets/ 2>/dev/null || true
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios
      - name: App-Bound Domain setzen
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains array" $P
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:0 string familien-kopf.de" $P
      - run: npx cap sync ios
      - name: iOS bauen (unsigniert)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: IPA verpacken
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r Spielhalle-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: spielhalle-ipa-unsigned
          path: Spielhalle-unsigned.ipa
